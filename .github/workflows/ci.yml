name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: url_shortener_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d url_shortener_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DB_CONNECTION: postgresql://postgres:postgres@localhost:5432/url_shortener_test
          TEST_DB_CONNECTION: postgresql://postgres:postgres@localhost:5432/url_shortener_test

          JWT_SECRET_KEY: test-secret-key
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30

        run: |
          pytest --cov=src --cov-report=term-missing